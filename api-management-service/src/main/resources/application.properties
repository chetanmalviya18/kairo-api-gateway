spring.application.name=kairo-api-gateway-management-service

server.port=8081

info.app.name=Kairo - Api Gateway - API Management Service
info.app.description=API Management Service for managing APIs, DB and other resources

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kairo_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET}

gateway.kafka.configuration-topic=${KAIRO_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${KAIRO_KAFKA_SERVERS:localhost:9092}