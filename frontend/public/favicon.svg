<svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kairo-fav-bg" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d5a37" />
      <stop offset="1" stop-color="#183e26" />
    </linearGradient>
    <linearGradient id="kairo-fav-flow" x1="17" y1="11" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ddff8f" />
      <stop offset="1" stop-color="#a7e844" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="42" height="42" rx="10" fill="url(#kairo-fav-bg)" />
  <rect x="0.75" y="0.75" width="40.5" height="40.5" rx="9.25" stroke="#a7e844" stroke-width="1.2" stroke-opacity="0.35" />

