  <path d="M32 16C33.5 18 34 20 34 21C34 22 33.5 24 32 26" stroke="#c9f66f" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Vertical Control Plane Spine -->
  <rect x="10.5" y="10.5" width="4.5" height="21" rx="2.25" fill="#fffcf2" />

  <!-- Routing Vector Flows -->
  <path d="M18.5 21L28.5 11" stroke="url(#kairo-fav-flow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M18.5 21L28.5 31" stroke="url(#kairo-fav-flow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Convergence Node -->
  <circle cx="18.5" cy="21" r="2.8" fill="#ddff8f" />
  <circle cx="18.5" cy="21" r="1.3" fill="#183e26" />

  <!-- Microservice Target Nodes -->
  <circle cx="28.5" cy="11" r="1.6" fill="#fffcf2" />
  <circle cx="28.5" cy="31" r="1.6" fill="#fffcf2" />
