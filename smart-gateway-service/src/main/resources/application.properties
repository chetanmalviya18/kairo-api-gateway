spring.application.name=kairo-api-gateway-smart-gateway-service

server.port=8080

info.app.name=Kairo - Api Gateway - Smart Gateway Service
info.app.description=Custom API Gateway for routing, security and traffic management

management.api.username=${KAIRO_GATEWAY_USERNAME:gateway_service}
management.api.password=${KAIRO_GATEWAY_PASSWORD:12345678}
management.api.base-url=${KAIRO_GATEWAY_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${KAIRO_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${KAIRO_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${KAIRO_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer